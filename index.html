<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Würfel — Zufalls-Satzgenerator</title>
  <meta name="description" content="Sätze eintragen, würfeln lassen, kopieren. Ein verspielter Zufallsgenerator mit gemeinsamer Satzliste für alle Besucher.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎲</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-1: #312e81;
      --bg-2: #7c3aed;
      --bg-3: #db2777;
      --card: #ffffff;
      --ink: #1e1b4b;
      --ink-soft: #6366a3;
      --accent-1: #f97316;
      --accent-2: #ec4899;
      --pip: #312e81;
      --ok: #16a34a;
      --radius: 22px;
      --shadow: 0 18px 40px -12px rgba(30, 27, 75, 0.45);
      --font-head: "Baloo 2", "Comic Sans MS", system-ui, sans-serif;
      --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: var(--font-body);
      color: var(--ink);
      background: linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 55%, var(--bg-3) 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 64px;
    }

    /* schwebende Deko-Formen im Hintergrund */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.35;
      pointer-events: none;
      z-index: 0;
    }
    .blob-1 { width: 340px; height: 340px; background: #f97316; top: -80px; left: -100px; }
    .blob-2 { width: 280px; height: 280px; background: #22d3ee; bottom: -60px; right: -80px; }

    main {
      width: 100%;
      max-width: 640px;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* ---------- Kopf ---------- */
    header { text-align: center; color: #fff; padding-top: 8px; }
    header h1 {
      font-family: var(--font-head);
      font-size: clamp(2.4rem, 8vw, 3.4rem);
      font-weight: 800;
      margin: 0;
      letter-spacing: 0.02em;
      text-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
    }
    header h1 .emoji { display: inline-block; transform: rotate(-12deg); }
    header p {
      margin: 6px 0 0;
      font-size: 1.05rem;
      opacity: 0.9;
      font-weight: 600;
    }

    /* ---------- Würfel-Bühne ---------- */
    .stage-card {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: var(--radius);
      padding: 34px 20px 26px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 26px;
    }

    .scene {
      width: 110px;
      height: 110px;
      perspective: 620px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .scene:hover { animation: wiggle 0.6s ease-in-out infinite; }
    @keyframes wiggle {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(5deg); }
    }

    .cube {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transform: rotateX(-18deg) rotateY(24deg);
      transition: transform 1.15s cubic-bezier(0.22, 1.2, 0.36, 1);
    }

    .face {
      position: absolute;
      inset: 0;
      background: linear-gradient(145deg, #ffffff, #e8e6ff);
      border-radius: 20px;
      box-shadow: inset 0 0 14px rgba(49, 46, 129, 0.18);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      padding: 14px;
    }
    .face-1 { transform: translateZ(55px); }
    .face-6 { transform: rotateY(180deg) translateZ(55px); }
    .face-3 { transform: rotateY(90deg) translateZ(55px); }
    .face-4 { transform: rotateY(-90deg) translateZ(55px); }
    .face-2 { transform: rotateX(90deg) translateZ(55px); }
    .face-5 { transform: rotateX(-90deg) translateZ(55px); }

    .pip {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #5b54c9, var(--pip) 70%);
      align-self: center;
      justify-self: center;
    }
    .p11 { grid-area: 1 / 1; } .p12 { grid-area: 1 / 2; } .p13 { grid-area: 1 / 3; }
    .p21 { grid-area: 2 / 1; } .p22 { grid-area: 2 / 2; } .p23 { grid-area: 2 / 3; }
    .p31 { grid-area: 3 / 1; } .p32 { grid-area: 3 / 2; } .p33 { grid-area: 3 / 3; }

    .roll-btn {
      font-family: var(--font-head);
      font-size: 1.35rem;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      border: none;
      border-radius: 999px;
      padding: 14px 44px;
      cursor: pointer;
      box-shadow: 0 10px 24px -8px rgba(236, 72, 153, 0.7);
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.2s ease;
    }
    .roll-btn:hover:not(:disabled) { transform: translateY(-2px) scale(1.03); box-shadow: 0 14px 30px -8px rgba(236, 72, 153, 0.8); }
    .roll-btn:active:not(:disabled) { transform: translateY(1px) scale(0.98); }
    .roll-btn:disabled { opacity: 0.55; cursor: not-allowed; }

    .stage-hint {
      color: rgba(255, 255, 255, 0.85);
      font-size: 0.95rem;
      font-weight: 600;
      margin: -10px 0 0;
      text-align: center;
    }

    /* Konfetti-Partikel */
    .particle {
      position: absolute;
      font-size: 1.2rem;
      pointer-events: none;
      animation: fly 0.9s ease-out forwards;
      z-index: 5;
    }
    @keyframes fly {
      from { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; }
      to { transform: translate(var(--dx), var(--dy)) scale(0.4) rotate(var(--rot)); opacity: 0; }
    }

    /* ---------- Ergebnis ---------- */
    .result-card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 26px 24px;
      text-align: center;
      display: none;
      flex-direction: column;
      gap: 18px;
    }
    .result-card.visible { display: flex; animation: pop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
    @keyframes pop {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .result-label {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--ink-soft);
      margin: 0;
    }
    .result-text {
      font-family: var(--font-head);
      font-size: clamp(1.3rem, 5vw, 1.7rem);
      font-weight: 700;
      line-height: 1.35;
      margin: 0;
      overflow-wrap: anywhere;
    }
    .copy-btn {
      align-self: center;
      font-family: var(--font-body);
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      background: var(--ink);
      border: none;
      border-radius: 999px;
      padding: 12px 30px;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.25s ease;
    }
    .copy-btn:hover { transform: translateY(-2px); }
    .copy-btn.copied { background: var(--ok); }

    /* ---------- Satzliste ---------- */
    .manage-card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .manage-card h2 {
      font-family: var(--font-head);
      font-size: 1.35rem;
      font-weight: 700;
      margin: 0;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
    }
    .count-badge {
      font-family: var(--font-body);
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--bg-2);
      background: #f1efff;
      border-radius: 999px;
      padding: 4px 12px;
      white-space: nowrap;
    }

    .add-row { display: flex; gap: 10px; }
    .add-row input {
      flex: 1;
      min-width: 0;
      font-family: var(--font-body);
      font-size: 1rem;
      padding: 12px 16px;
      border: 2px solid #e2e0f5;
      border-radius: 14px;
      outline: none;
      transition: border-color 0.2s ease;
    }
    .add-row input:focus { border-color: var(--bg-2); }
    .add-row button {
      font-size: 1.4rem;
      line-height: 1;
      font-weight: 700;
      color: #fff;
      background: var(--bg-2);
      border: none;
      border-radius: 14px;
      padding: 0 18px;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s ease, opacity 0.2s ease;
    }
    .add-row button:hover:not(:disabled) { transform: scale(1.06); background: #6d28d9; }
    .add-row button:disabled { opacity: 0.55; cursor: not-allowed; }

    ul.sentence-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .sentence-list li {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #f7f6ff;
      border-radius: 14px;
      padding: 10px 14px;
      animation: slide-in 0.25s ease;
    }
    @keyframes slide-in {
      from { transform: translateX(-8px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    .sentence-list li span { flex: 1; overflow-wrap: anywhere; font-weight: 600; }

    .empty-note {
      text-align: center;
      color: var(--ink-soft);
      font-weight: 600;
      margin: 4px 0;
    }
    .retry-btn {
      align-self: center;
      font-family: var(--font-body);
      font-size: 0.9rem;
      font-weight: 700;
      color: #fff;
      background: var(--bg-2);
      border: none;
      border-radius: 999px;
      padding: 10px 22px;
      cursor: pointer;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      border-top: 2px dashed #e2e0f5;
      padding-top: 16px;
    }
    .tool-btn {
      font-family: var(--font-body);
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--ink);
      background: #f1efff;
      border: none;
      border-radius: 999px;
      padding: 10px 18px;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.15s ease;
    }
    .tool-btn:hover { background: #e2e0f5; transform: translateY(-1px); }

    .share-note {
      text-align: center;
      font-size: 0.82rem;
      color: var(--ink-soft);
      font-weight: 600;
      margin: 0;
    }

    footer {
      margin-top: 28px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.85rem;
      font-weight: 600;
      text-align: center;
      z-index: 1;
    }
    footer a { color: #fff; }

    /* ---------- Toast ---------- */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 26px;
      transform: translate(-50%, 80px);
      background: var(--ink);
      color: #fff;
      font-weight: 700;
      padding: 12px 24px;
      border-radius: 999px;
      box-shadow: var(--shadow);
      opacity: 0;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
      z-index: 10;
      max-width: calc(100vw - 32px);
      text-align: center;
    }
    .toast.show { transform: translate(-50%, 0); opacity: 1; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <main>
    <header>
      <h1><span class="emoji">🎲</span> Würfel</h1>
      <p>Dein Zufalls-Satzgenerator</p>
    </header>

    <section class="stage-card" aria-label="Würfeln">
      <div class="scene" id="scene" aria-hidden="true">
        <div class="cube" id="cube">
          <div class="face face-1"><span class="pip p22"></span></div>
          <div class="face face-2"><span class="pip p11"></span><span class="pip p33"></span></div>
          <div class="face face-3"><span class="pip p11"></span><span class="pip p22"></span><span class="pip p33"></span></div>
          <div class="face face-4"><span class="pip p11"></span><span class="pip p13"></span><span class="pip p31"></span><span class="pip p33"></span></div>
          <div class="face face-5"><span class="pip p11"></span><span class="pip p13"></span><span class="pip p22"></span><span class="pip p31"></span><span class="pip p33"></span></div>
          <div class="face face-6"><span class="pip p11"></span><span class="pip p21"></span><span class="pip p31"></span><span class="pip p13"></span><span class="pip p23"></span><span class="pip p33"></span></div>
        </div>
      </div>
      <button class="roll-btn" id="rollBtn" type="button" disabled>Würfeln!</button>
      <p class="stage-hint" id="stageHint" hidden>Füge unten zuerst ein paar Sätze hinzu ⬇️</p>
    </section>

    <section class="result-card" id="resultCard" aria-label="Ergebnis">
      <p class="result-label">Der Würfel sagt:</p>
      <p class="result-text" id="resultText" aria-live="polite"></p>
      <button class="copy-btn" id="copyBtn" type="button">📋 Kopieren</button>
    </section>

    <section class="manage-card" aria-label="Gemeinsame Sätze">
      <h2>Unsere Sätze <span class="count-badge" id="countBadge">–</span></h2>

      <div class="add-row">
        <input type="text" id="sentenceInput" placeholder="Neuen Satz eintragen …" maxlength="500" aria-label="Neuer Satz">
        <button id="addBtn" type="button" title="Satz eintragen" aria-label="Satz eintragen">+</button>
      </div>

      <ul class="sentence-list" id="sentenceList"></ul>
      <p class="empty-note" id="statusNote">Lade Sätze …</p>
      <button class="retry-btn" id="retryBtn" type="button" hidden>Erneut versuchen</button>

      <div class="toolbar">
        <button class="tool-btn" id="refreshBtn" type="button">🔄 Aktualisieren</button>
        <button class="tool-btn" id="exportBtn" type="button">⬇️ Export (.txt)</button>
      </div>
      <p class="share-note">Gemeinsame Liste: Was du einträgst, sehen alle Besucher. Einträge können hier nicht gelöscht werden.</p>
    </section>
  </main>

  <footer>
    Ein Würfel für alle ·
    <a href="https://github.com/norocketscience/wuerfel" rel="noopener">Quellcode auf GitHub</a>
  </footer>

  <div class="toast" id="toast" role="status"></div>

  <script>
    (function () {
      'use strict';

      /* Firebase Realtime Database (REST-API, append-only per Serverregeln) */
      var DB_URL = 'https://wuerfel-3e3eb-default-rtdb.firebaseio.com';
      var DB_ENDPOINT = DB_URL.replace(/\/+$/, '') + '/saetze.json';
      var CACHE_KEY = 'wuerfel.shared.cache.v1';
      var REFRESH_MIN_MS = 30000;

      var sentences = [];
      var loadState = 'loading'; /* loading | ready | error */
      var lastIndex = -1;
      var rolling = false;
      var adding = false;
      var lastFetch = 0;
      var rotX = -18;
      var rotY = 24;
      var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      var cube = document.getElementById('cube');
      var scene = document.getElementById('scene');
      var rollBtn = document.getElementById('rollBtn');
      var stageHint = document.getElementById('stageHint');
      var resultCard = document.getElementById('resultCard');
      var resultText = document.getElementById('resultText');
      var copyBtn = document.getElementById('copyBtn');
      var sentenceInput = document.getElementById('sentenceInput');
      var addBtn = document.getElementById('addBtn');
      var sentenceList = document.getElementById('sentenceList');
      var statusNote = document.getElementById('statusNote');
      var retryBtn = document.getElementById('retryBtn');
      var countBadge = document.getElementById('countBadge');
      var refreshBtn = document.getElementById('refreshBtn');
      var exportBtn = document.getElementById('exportBtn');
      var toast = document.getElementById('toast');
      var toastTimer = null;

      /* ---------- Laden & Speichern (gemeinsame Datenbank) ---------- */

      function parseDb(data) {
        if (!data || typeof data !== 'object') return [];
        /* Push-Keys sind chronologisch sortierbar */
        return Object.keys(data).sort().map(function (k) { return data[k]; })
          .filter(function (s) { return typeof s === 'string' && s.trim() !== ''; });
      }

      function loadSentences(showErrors) {
        lastFetch = Date.now();
        fetch(DB_ENDPOINT, { cache: 'no-store' })
          .then(function (res) {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.json();
          })
          .then(function (data) {
            sentences = parseDb(data);
            loadState = 'ready';
            try { localStorage.setItem(CACHE_KEY, JSON.stringify(sentences)); } catch (e) { /* egal */ }
            render();
          })
          .catch(function () {
            var cached = null;
            try { cached = JSON.parse(localStorage.getItem(CACHE_KEY)); } catch (e) { /* egal */ }
            if (Array.isArray(cached) && cached.length > 0) {
              sentences = cached;
              loadState = 'ready';
              render();
              showToast('Keine Verbindung — zeige letzten bekannten Stand');
            } else {
              loadState = 'error';
              render();
              if (showErrors) showToast('Liste konnte nicht geladen werden');
            }
          });
      }

      function addSentence() {
        var text = sentenceInput.value.trim();
        if (!text || adding) return;
        if (sentences.indexOf(text) !== -1) {
          showToast('Diesen Satz gibt es schon 😉');
          return;
        }
        adding = true;
        addBtn.disabled = true;
        fetch(DB_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(text)
        })
          .then(function (res) {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.json();
          })
          .then(function () {
            sentenceInput.value = '';
            showToast('Satz für alle gespeichert ✓');
            loadSentences(true); /* frisch laden, inkl. Einträgen anderer */
          })
          .catch(function () {
            showToast('Speichern fehlgeschlagen — bitte später erneut versuchen');
          })
          .then(function () {
            adding = false;
            addBtn.disabled = false;
            sentenceInput.focus();
          });
      }

      /* ---------- Zufall ---------- */

      function randomInt(maxExclusive) {
        if (window.crypto && window.crypto.getRandomValues) {
          var buf = new Uint32Array(1);
          window.crypto.getRandomValues(buf);
          return buf[0] % maxExclusive;
        }
        return Math.floor(Math.random() * maxExclusive);
      }

      function pickSentenceIndex() {
        if (sentences.length === 1) return 0;
        var idx;
        do { idx = randomInt(sentences.length); } while (idx === lastIndex);
        return idx;
      }

      /* ---------- Rendern ---------- */

      function render() {
        sentenceList.textContent = '';
        sentences.forEach(function (text) {
          var li = document.createElement('li');
          var span = document.createElement('span');
          span.textContent = text;
          li.appendChild(span);
          sentenceList.appendChild(li);
        });

        var n = sentences.length;
        countBadge.textContent = loadState === 'ready' ? (n === 1 ? '1 Satz' : n + ' Sätze') : '–';

        if (loadState === 'loading') {
          statusNote.textContent = 'Lade Sätze …';
          statusNote.hidden = false;
          retryBtn.hidden = true;
        } else if (loadState === 'error') {
          statusNote.textContent = 'Die Liste konnte nicht geladen werden.';
          statusNote.hidden = false;
          retryBtn.hidden = false;
        } else {
          statusNote.textContent = 'Noch keine Sätze — trag den ersten ein! ✨';
          statusNote.hidden = n > 0;
          retryBtn.hidden = true;
        }

        stageHint.hidden = !(loadState === 'ready' && n === 0);
        rollBtn.disabled = rolling || loadState !== 'ready' || n === 0;
      }

      /* ---------- Würfeln ---------- */

      /* Zielrotation, damit Fläche N vorne liegt (Gegenseiten summieren sich zu 7) */
      var FACE_ROTATIONS = {
        1: { x: 0, y: 0 },
        2: { x: -90, y: 0 },
        3: { x: 0, y: -90 },
        4: { x: 0, y: 90 },
        5: { x: 90, y: 0 },
        6: { x: 0, y: 180 }
      };

      function roll() {
        if (rolling || loadState !== 'ready' || sentences.length === 0) return;
        rolling = true;
        rollBtn.disabled = true;
        resultCard.classList.remove('visible');

        var idx = pickSentenceIndex();
        var face = FACE_ROTATIONS[1 + randomInt(6)];

        function finish() {
          lastIndex = idx;
          resultText.textContent = sentences[idx];
          resultCard.classList.add('visible');
          resetCopyBtn();
          burstConfetti();
          rolling = false;
          render();
        }

        if (reducedMotion) {
          finish();
          return;
        }

        /* volle Extra-Drehungen aufaddieren, damit die Animation immer vorwärts läuft */
        rotX = Math.round(rotX / 360) * 360 + 360 * (1 + randomInt(2)) + face.x - 18;
        rotY = Math.round(rotY / 360) * 360 + 360 * (1 + randomInt(2)) + face.y + 24;
        cube.style.transform = 'rotateX(' + rotX + 'deg) rotateY(' + rotY + 'deg)';

        var done = false;
        function onDone() {
          if (done) return;
          done = true;
          finish();
        }
        cube.addEventListener('transitionend', onDone, { once: true });
        setTimeout(onDone, 1400); /* Fallback, falls transitionend ausbleibt */
      }

      function burstConfetti() {
        if (reducedMotion) return;
        var symbols = ['🎉', '✨', '⭐', '🎊'];
        for (var i = 0; i < 10; i++) {
          var p = document.createElement('span');
          p.className = 'particle';
          p.textContent = symbols[randomInt(symbols.length)];
          var angle = (Math.PI * 2 * i) / 10 + Math.random();
          p.style.setProperty('--dx', Math.cos(angle) * (60 + randomInt(50)) + 'px');
          p.style.setProperty('--dy', Math.sin(angle) * (60 + randomInt(50)) + 'px');
          p.style.setProperty('--rot', randomInt(360) + 'deg');
          p.style.left = '50%';
          p.style.top = '50%';
          scene.appendChild(p);
          p.addEventListener('animationend', function (e) { e.target.remove(); });
        }
      }

      /* ---------- Kopieren ---------- */

      function resetCopyBtn() {
        copyBtn.classList.remove('copied');
        copyBtn.textContent = '📋 Kopieren';
      }

      function copyResult() {
        var text = resultText.textContent;
        if (!text) return;

        function onCopied() {
          copyBtn.classList.add('copied');
          copyBtn.textContent = 'Kopiert! ✓';
          showToast('In die Zwischenablage kopiert ✓');
          setTimeout(resetCopyBtn, 1800);
        }

        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(onCopied, function () { legacyCopy(text, onCopied); });
        } else {
          legacyCopy(text, onCopied);
        }
      }

      function legacyCopy(text, onCopied) {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try {
          if (document.execCommand('copy')) onCopied();
          else showToast('Kopieren nicht möglich — bitte manuell markieren');
        } catch (e) {
          showToast('Kopieren nicht möglich — bitte manuell markieren');
        }
        ta.remove();
      }

      /* ---------- Export ---------- */

      function exportTxt() {
        if (sentences.length === 0) {
          showToast('Keine Sätze zum Exportieren');
          return;
        }
        var blob = new Blob([sentences.join('\n') + '\n'], { type: 'text/plain;charset=utf-8' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'wuerfel-saetze.txt';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        showToast('Satzliste exportiert ⬇️');
      }

      /* ---------- Toast ---------- */

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add('show');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 2200);
      }

      /* ---------- Events ---------- */

      rollBtn.addEventListener('click', roll);
      scene.addEventListener('click', roll);
      copyBtn.addEventListener('click', copyResult);
      addBtn.addEventListener('click', addSentence);
      sentenceInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') addSentence();
      });
      refreshBtn.addEventListener('click', function () { loadState = 'loading'; render(); loadSentences(true); });
      retryBtn.addEventListener('click', function () { loadState = 'loading'; render(); loadSentences(true); });
      exportBtn.addEventListener('click', exportTxt);
      document.addEventListener('visibilitychange', function () {
        /* Beim Zurückkehren zum Tab frische Daten holen (gedrosselt) */
        if (!document.hidden && loadState === 'ready' && Date.now() - lastFetch > REFRESH_MIN_MS) {
          loadSentences(false);
        }
      });

      render();
      loadSentences(true);
    })();
  </script>
</body>
</html>
